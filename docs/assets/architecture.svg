    <path d="M835 225 L880 180" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="500" y="325" font-size="13" fill="#57606a">Cloud transport: the texts and phone numbers go through the chosen provider. Illustration.</text>
