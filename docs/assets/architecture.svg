    <text x="425" y="148" font-size="14" fill="#57606a">Docker container</text>
    <text x="425" y="168" font-size="14" fill="#57606a">one provider at a time</text>
    <text x="425" y="188" font-size="14" fill="#57606a">/data: counters, replies,</text>
    <text x="425" y="208" font-size="14" fill="#57606a">pending delivery reports</text>
