    <text x="730" y="64" font-size="19" font-weight="bold" fill="#1f2328">SMSFactor API</text>
    <text x="730" y="90" font-size="13" fill="#57606a">api.smsfactor.com</text>
    <text x="730" y="110" font-size="13" fill="#57606a">send, credits, senders,</text>
    <text x="730" y="130" font-size="13" fill="#57606a">delivery, replies</text>
    <rect x="630" y="170" width="200" height="120" rx="14" fill="#f6eefb" stroke="#8250df" stroke-width="2"/>
    <text x="730" y="204" font-size="19" font-weight="bold" fill="#1f2328">Octopush API</text>
    <text x="730" y="230" font-size="13" fill="#57606a">api.octopush.com</text>
    <text x="730" y="250" font-size="13" fill="#57606a">send, balance</text>
    <text x="730" y="270" font-size="13" fill="#57606a">(premium or low cost)</text>
    <rect x="885" y="105" width="100" height="110" rx="14" fill="#fff7e6" stroke="#bf8700" stroke-width="2"/>
    <text x="935" y="145" font-size="18" font-weight="bold" fill="#1f2328">Phones</text>
    <text x="935" y="170" font-size="13" fill="#57606a">any</text>
    <text x="935" y="188" font-size="13" fill="#57606a">operator</text>
    <path d="M235 160 H305" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="270" y="140" font-size="12" fill="#57606a">REST</text>
    <text x="270" y="185" font-size="12" fill="#57606a">+ WebSocket</text>
    <text x="270" y="270" font-size="12" fill="#57606a">/api/integration/v1/*</text>
    <path d="M545 140 L625 95" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
